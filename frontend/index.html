<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belote</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span id="title" class="title"></span>
        <span id="status" class="status"></span>
        <span id="scoreboard" class="scoreboard"></span>
        <button id="new-match" type="button" hidden>Nouvelle partie</button>
        <button id="change-seat" type="button" hidden>Changez le joueur</button>
        <button id="voice-bid" type="button" hidden title="Activer Vosk sur cet appareil pour les enchères : oui, prends, non, deux, cœur, piques, carreaux, trèfles. Aucun envoi audio.">🎙 Activer l’audio</button>
        <span id="voice-msg" class="voice-msg" role="status" hidden></span>
        <div id="voice-debug" class="voice-debug" hidden>
          <span>Entendu : <output id="voice-transcript">—</output></span>
          <output id="voice-match" role="status"></output>
        </div>
        <span id="worker-msg" class="worker-msg"></span>
      </header>
      <div id="table"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
